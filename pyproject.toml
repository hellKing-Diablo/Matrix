[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix"
version = "0.1.0"
description = "MATRIX V1 WhatsApp-first business-card ingestion system"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2"
]

[tool.setuptools.packages.find]
include = ["app*"]
